name: Build Release Package

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag da release existente (ex: v1.1.0) — obrigatório no disparo manual"
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Resolver versão
        id: version
        shell: pwsh
        run: |
          $tag = "${{ github.event.release.tag_name }}"
          if ([string]::IsNullOrWhiteSpace($tag)) {
            $tag = "${{ inputs.tag }}"
          }
          if ([string]::IsNullOrWhiteSpace($tag)) {
            throw "Tag da release não encontrada."
          }
          # Aceita v1.2.3, V1.2.3 e o erro comum v.1.2.3
          $ver = $tag.Trim() -replace '^[vV]\.?', ''
          if ($ver -notmatch '^\d+\.\d+(\.\d+)?$') {
            throw "Tag inválida: $tag (use formato v1.2.3)"
          }
          if ($ver.Split('.').Length -eq 2) { $ver = "$ver.0" }
          $normalizedTag = "v$ver"
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "normalized_tag=$normalizedTag" >> $env:GITHUB_OUTPUT
          "version=$ver" >> $env:GITHUB_OUTPUT
          Write-Host "Release tag=$tag (normalizada=$normalizedTag) version=$ver"

      # NÃO usar PublishSingleFile aqui sem validar o app inteiro antes.
      # A v3.0.0 saiu em arquivo único e não abria no cliente: o WPF resolvia
      # Icon="icons/fto.ico" pelo arquivo em disco (efeito de o ícone ser Content além de
      # Resource) e essa resolução depende do caminho do assembly de entrada, que é vazio em
      # single-file — o MainWindow morria com "TypeConverterMarkupExtension iniciou uma exceção".
      # O csproj já foi corrigido e o login abre em single-file, mas voltar para o layout
      # multi-arquivo, que roda em produção desde sempre, é o que garante a atualização.
      - name: Publish win-x64 (self-contained)
        shell: pwsh
        run: |
          $ver = "${{ steps.version.outputs.version }}"
          dotnet publish "FTO_Sistema/FTO_App/FTO_App.csproj" `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:Version=$ver `
            -p:AssemblyVersion=$ver.0 `
            -p:FileVersion=$ver.0 `
            -p:InformationalVersion=$ver `
            -p:SatelliteResourceLanguages=pt-BR `
            -p:PublishReadyToRun=false `
            -p:DebugType=none `
            -p:DebugSymbols=false `
            -o "FTO_Sistema/publish/FTO_App-win-x64"

      - name: Compactar ZIP
        shell: pwsh
        run: |
          $dir = "FTO_Sistema/publish/FTO_App-win-x64"
          $zip = "FTO_App-win-x64.zip"
          if (Test-Path $zip) { Remove-Item $zip -Force }

          if (-not (Test-Path "$dir/FTO_App.exe")) { throw "Publish não gerou FTO_App.exe." }
          # .env local nunca pode ir junto no pacote público.
          Remove-Item "$dir/.env" -Force -ErrorAction SilentlyContinue

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          [System.IO.Compression.ZipFile]::CreateFromDirectory(
            (Resolve-Path $dir), (Join-Path (Get-Location) $zip), 'Optimal', $false)

          $tamanho = (Get-Item $zip).Length / 1MB
          $arquivos = (Get-ChildItem $dir -Recurse -File).Count
          Write-Host ("Pacote: {0:N1} MB a partir de {1} arquivos" -f $tamanho, $arquivos)

      - name: Anexar ZIP na Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $tag = "${{ steps.version.outputs.tag }}"
          gh release upload $tag "FTO_App-win-x64.zip" --clobber
